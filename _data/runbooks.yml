categories:
  - name: "Databases"
    slug: "databases"
    description: "Runbooks for MySQL, PostgreSQL, Redis, MongoDB, Elasticsearch, and more."
    runbooks:
      - slug: "mysql"
        title: "MySQL"
        description: "Troubleshooting guide for MySQL alerting rules — connections, replication, InnoDB, and slow queries."
        alerts:
          - name: "MySQL down"
            severity: critical
            symptoms: "The mysqld_exporter reports mysql_up == 0. The MySQL instance is unreachable."
            causes:
              - "Process crashed or was OOM-killed"
              - "Disk full — InnoDB cannot write redo logs"
              - "Corrupted data directory"
              - "Authentication plugin change broke the exporter user"
            steps:
              - "Check the MySQL error log: `journalctl -u mysql --since '5 minutes ago'` or `/var/log/mysql/error.log`"
              - "Check if the process is running: `systemctl status mysql`"
              - "Check disk space: `df -h /var/lib/mysql`"
              - "Attempt to start: `systemctl start mysql` — capture output"
              - "If disk full, identify the largest files: `du -sh /var/lib/mysql/* | sort -rh | head`"
              - "Check exporter connectivity: `mysql -u exporter -p -h localhost -e 'SELECT 1'`"

          - name: "MySQL too many connections"
            severity: warning
            symptoms: "Connection count exceeds 80% of max_connections. New connections may be refused."
            causes:
              - "Connection leak in application — connections not returned to pool"
              - "Slow queries holding connections open"
              - "max_connections set too low for the workload"
            steps:
              - "Check current connections: `SHOW STATUS LIKE 'Threads_connected';`"
              - "Identify who is connected: `SHOW PROCESSLIST;`"
              - "Find long-running queries: `SELECT * FROM information_schema.processlist WHERE time > 30 ORDER BY time DESC;`"
              - "Kill blocking queries if safe: `KILL QUERY <id>;`"
              - "Check max_connections: `SHOW VARIABLES LIKE 'max_connections';`"
              - "Increase temporarily if needed: `SET GLOBAL max_connections = 500;` (persists until restart — also update my.cnf)"

          - name: "MySQL slow queries"
            severity: warning
            symptoms: "Slow query rate is elevated. Queries exceeding long_query_time are accumulating."
            causes:
              - "Missing indexes on frequently queried columns"
              - "Table scans on large tables"
              - "Lock contention"
              - "Inefficient query patterns after a schema or data change"
            steps:
              - "Enable slow query log if not already: `SET GLOBAL slow_query_log = 1; SET GLOBAL long_query_time = 1;`"
              - "Check slow query log: `/var/log/mysql/slow.log`"
              - "Use pt-query-digest for analysis: `pt-query-digest /var/log/mysql/slow.log | head -100`"
              - "For the top queries, run EXPLAIN: `EXPLAIN SELECT ...`"
              - "Add missing indexes or rewrite queries as needed"

      - slug: "postgresql"
        title: "PostgreSQL"
        description: "Troubleshooting guide for PostgreSQL alerting rules — connections, replication lag, bloat, and locks."
        alerts:
          - name: "PostgreSQL down"
            severity: critical
            symptoms: "pg_up == 0. The PostgreSQL instance is unreachable."
            causes:
              - "Postmaster process crashed"
              - "Disk full — WAL directory or data directory"
              - "OOM kill"
            steps:
              - "Check logs: `journalctl -u postgresql --since '5 minutes ago'`"
              - "Check process: `systemctl status postgresql`"
              - "Check disk: `df -h /var/lib/postgresql`"
              - "Check WAL directory size: `du -sh /var/lib/postgresql/*/pg_wal`"
              - "Attempt restart: `systemctl restart postgresql`"

          - name: "PostgreSQL too many connections"
            severity: warning
            symptoms: "Active connections exceed 80% of max_connections."
            causes:
              - "PgBouncer not in use or misconfigured"
              - "Connection leak in application"
              - "Idle transactions keeping connections open"
            steps:
              - "Check current connections: `SELECT count(*) FROM pg_stat_activity;`"
              - "Find idle-in-transaction connections: `SELECT pid, now() - state_change AS duration, query FROM pg_stat_activity WHERE state = 'idle in transaction' ORDER BY duration DESC;`"
              - "Terminate idle connections if safe: `SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE state = 'idle in transaction' AND now() - state_change > interval '10 minutes';`"
              - "Consider deploying PgBouncer as a connection pooler"

          - name: "PostgreSQL replication lag"
            severity: warning
            symptoms: "Replication lag between primary and replica exceeds threshold."
            causes:
              - "Replica under high load — can't keep up with WAL replay"
              - "Network congestion between primary and replica"
              - "Long-running transaction on primary blocking WAL"
            steps:
              - "Check lag on replica: `SELECT now() - pg_last_xact_replay_timestamp() AS replication_lag;`"
              - "Check replication slots on primary: `SELECT slot_name, pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)) AS retained_wal FROM pg_replication_slots;`"
              - "Check replica load: `top`, `iostat -x 1`"
              - "Check for long-running transactions on primary: `SELECT pid, now() - xact_start AS duration, query FROM pg_stat_activity WHERE xact_start IS NOT NULL ORDER BY duration DESC LIMIT 5;`"

      - slug: "redis"
        title: "Redis"
        description: "Troubleshooting guide for Redis alerting rules — memory, persistence, replication, and latency."
        alerts:
          - name: "Redis down"
            severity: critical
            symptoms: "redis_up == 0. Redis is not responding to the exporter."
            causes:
              - "Process crashed or was OOM-killed"
              - "Maxmemory reached with policy noeviction"
              - "AOF or RDB write failure causing crash"
            steps:
              - "Check Redis logs: `/var/log/redis/redis-server.log`"
              - "Check process: `systemctl status redis`"
              - "Check memory: `free -h`"
              - "Attempt restart: `systemctl restart redis`"
              - "Check config: `redis-cli CONFIG GET maxmemory`"

          - name: "Redis memory high"
            severity: warning
            symptoms: "Redis memory usage exceeds 90% of maxmemory."
            causes:
              - "No TTL set on keys — keys accumulate indefinitely"
              - "Sudden spike in data ingestion"
              - "Eviction policy not configured"
            steps:
              - "Check memory: `redis-cli INFO memory | grep -E 'used_memory_human|maxmemory_human|mem_fragmentation_ratio'`"
              - "Check eviction policy: `redis-cli CONFIG GET maxmemory-policy`"
              - "Check key count and TTL distribution: `redis-cli INFO keyspace`"
              - "Find large keys (use carefully on production): `redis-cli --bigkeys`"
              - "If no eviction policy is set, consider `allkeys-lru` for cache workloads"

  - name: "Infrastructure"
    slug: "infrastructure"
    description: "Runbooks for host/hardware alerts, Docker, Systemd, and Blackbox."
    runbooks:
      - slug: "host-and-hardware"
        title: "Host & Hardware"
        description: "Troubleshooting guide for node_exporter alerts — CPU, memory, disk, and network."
        alerts:
          - name: "Host out of memory"
            severity: critical
            symptoms: "Available memory is less than 10% of total. OOM kills are imminent."
            causes:
              - "Memory leak in an application"
              - "Unexpected traffic spike"
              - "Runaway process"
            steps:
              - "Identify top memory consumers: `ps aux --sort=-%mem | head -20`"
              - "Check OOM kill history: `dmesg | grep -i 'killed process'`"
              - "Check swap usage: `free -h`"
              - "If a known service is leaking, restart it: `systemctl restart <service>`"
              - "If persistent, investigate heap dumps or memory profiling"

          - name: "Host disk will fill in 24h"
            severity: warning
            symptoms: "Disk fill rate predicts exhaustion within 24 hours."
            causes:
              - "Log files growing unchecked"
              - "Database write-ahead log accumulation"
              - "Large temporary files from batch jobs"
            steps:
              - "Find the largest directories: `du -sh /* 2>/dev/null | sort -rh | head -20`"
              - "Check log sizes: `du -sh /var/log/*`"
              - "Check if logrotate is working: `systemctl status logrotate`"
              - "Find recently modified large files: `find / -size +100M -mtime -1 2>/dev/null`"
              - "If logs: configure logrotate or reduce log verbosity"
              - "If database WAL: check for stuck replication slots or long transactions"

  - name: "Orchestrators"
    slug: "orchestrators"
    description: "Runbooks for Kubernetes, Nomad, Consul, and Etcd."
    runbooks:
      - slug: "kubernetes"
        title: "Kubernetes"
        description: "Troubleshooting guide for Kubernetes alerting rules — nodes, pods, deployments, and resource pressure."
        alerts:
          - name: "Kubernetes node not ready"
            severity: critical
            symptoms: "A node is in NotReady state. Pods on this node may be evicted or unreachable."
            causes:
              - "Kubelet crashed or not running"
              - "Node out of disk, memory, or PID resources"
              - "Network partition — node cannot reach the API server"
            steps:
              - "Check node status: `kubectl get nodes -o wide`"
              - "Describe the node for conditions: `kubectl describe node <node-name>`"
              - "SSH to the node and check kubelet: `systemctl status kubelet`"
              - "Check kubelet logs: `journalctl -u kubelet --since '10 minutes ago' | tail -50`"
              - "Check node resource pressure: `kubectl describe node <node-name> | grep -A5 Conditions`"
              - "If kubelet is stopped, restart it: `systemctl restart kubelet`"

          - name: "Kubernetes pod crash looping"
            severity: warning
            symptoms: "A pod is restarting frequently. The restart count is high."
            causes:
              - "Application crash — OOM, unhandled exception"
              - "Misconfigured liveness probe killing healthy pod"
              - "Missing ConfigMap, Secret, or volume"
            steps:
              - "Identify the crashing pod: `kubectl get pods -A | grep -v Running`"
              - "Check pod events: `kubectl describe pod <pod-name> -n <namespace>`"
              - "Check current logs: `kubectl logs <pod-name> -n <namespace>`"
              - "Check previous container logs: `kubectl logs <pod-name> -n <namespace> --previous`"
              - "If OOM: check memory limits and increase if appropriate"
              - "If liveness probe: review probe timing vs application startup time"

  - name: "Observability"
    slug: "observability"
    description: "Runbooks for Prometheus, Thanos, Loki, Grafana, and OpenTelemetry."
    runbooks:
      - slug: "prometheus"
        title: "Prometheus"
        description: "Troubleshooting guide for Prometheus self-monitoring alerts — TSDB, WAL, rule evaluation, and scrape failures."
        alerts:
          - name: "Prometheus target missing"
            severity: warning
            symptoms: "A scrape target has disappeared from the targets list. up{job=...} is absent."
            causes:
              - "Service restarted and changed IP/port"
              - "Service discovery configuration changed"
              - "Target is down or unreachable on the metrics port"
            steps:
              - "Check Prometheus targets UI: http://prometheus:9090/targets"
              - "Filter by the job name to see last error message"
              - "Try curling the metrics endpoint directly from the Prometheus host"
              - "If Kubernetes SD: check the pod/service labels match the relabeling rules"
              - "If static config: verify the host/port is correct and reachable"

          - name: "Prometheus rule evaluation slow"
            severity: warning
            symptoms: "Rule group evaluation takes longer than its interval. Alerts may be delayed."
            causes:
              - "Complex PromQL expressions with high cardinality"
              - "Prometheus under-resourced — insufficient CPU"
              - "TSDB under heavy write load"
            steps:
              - "Check rule evaluation duration: `prometheus_rule_group_last_duration_seconds`"
              - "Identify slow rule groups in Prometheus UI: Status → Rules"
              - "Pre-compute expensive sub-expressions as recording rules"
              - "Check Prometheus CPU and memory usage"
              - "Consider splitting large rule groups into smaller intervals"
