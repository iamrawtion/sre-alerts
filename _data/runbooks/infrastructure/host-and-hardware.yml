service: "Host & Hardware"
slug: "host-and-hardware"
category: "infrastructure"
category_name: "Infrastructure"
description: "Troubleshooting guide for node_exporter alerts — CPU, memory, disk, and network."

alerts:
  - name: "Host out of memory"
    slug: "host-out-of-memory"
    severity: critical

    overview:
      what: "Available memory is less than 10% of total. OOM kills are imminent or already occurring."
      contributing_factors:
        - "Memory leak in an application process"
        - "Unexpected traffic spike exhausting application caches"
        - "Runaway process consuming unbounded memory"
      affected_components:
        - "All processes on the host — the kernel OOM killer may terminate any of them"
        - "Swap (if configured) — high swap usage causes severe I/O latency"
      expected_action: "Identify the top memory consumers and either kill the runaway process or migrate services off the host."

    services:
      - name: "Host node"
        overview_url: "https://github.com/prometheus/node_exporter"
        team: ""

    metrics:
      name: "node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes"
      description: "Ratio of available memory (including reclaimable cache) to total physical memory."
      unit: "ratio (0–1), alert fires when < 0.1"
      threshold_rationale: "Below 10% available, the kernel OOM killer becomes active."
      normal_behavior: "Typically 30–60% available on a healthy host."
      screenshots:
        - file: "host-memory-firing.png"
          caption: "Dashboard when available memory drops below 10%"
        - file: "host-memory-recovery.png"
          caption: "Dashboard after memory recovers"

    alert_behavior:
      silencing: "Silence during known memory-intensive batch jobs with a time-bounded silence."
      frequency: "Uncommon — usually indicates a memory leak or misconfiguration."

    severities:
      guidance: "Critical. OOM kills can take down any process on the host without warning."
      impacted_users: "All users of services running on this host."
      things_to_check:
        - "Has the kernel already OOM-killed any processes? (`dmesg | grep -i 'killed process'`)"
        - "Is swap enabled and exhausted?"
        - "Which process is growing?"

    verification:
      prometheus_query: "node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1"
      dashboards:
        - name: "Node Overview"
          url: ""
      log_queries:
        - name: "OOM kill events"
          url: ""

    troubleshooting:
      steps:
        - "Identify top memory consumers: `ps aux --sort=-%mem | head -20`"
        - "Check OOM kill history: `dmesg | grep -i 'killed process'`"
        - "Check swap usage: `free -h`"
        - "If a specific service is leaking, restart it: `systemctl restart <service>`"
        - "If the leak is persistent, capture a heap dump before restarting for post-mortem analysis"
      dashboards:
        - name: "Node Overview"
          url: ""
      commands:
        - "ps aux --sort=-%mem | head -20"
        - "dmesg | grep -i 'killed process'"
        - "free -h"
        - "vmstat -s | head -10"

    resolutions:
      - description: "Memory leak in a Java service. Restarting the service recovered the host; heap profiling identified the leak."
        incident_url: ""

    dependencies:
      - "All services running on the host"
      - "OOM killer configuration (vm.oom_score_adj)"

    escalation:
      guidance: "Escalate if OOM kills have already occurred or if the host is unresponsive."
      slack_channels:
        - name: "#infrastructure-oncall"
          url: ""

    definitions:
      alert_url: ""
      tuning_notes: "The 10% threshold is a ratio of total memory — self-normalizing across host sizes."
      playbook_url: ""

    related:
      alerts:
        - name: "Host disk will fill in 24h"
          url: "../host-disk-will-fill-in-24h/"
      docs:
        - name: "node_exporter memory metrics"
          url: "https://github.com/prometheus/node_exporter"

    credits: "Template adapted from https://runbooks.gitlab.com/template-alert-playbook/"

  - name: "Host disk will fill in 24h"
    slug: "host-disk-will-fill-in-24h"
    severity: warning

    overview:
      what: "The current disk fill rate predicts the filesystem will be exhausted within 24 hours."
      contributing_factors:
        - "Log files growing unchecked (logrotate not configured or failing)"
        - "Database WAL accumulation from stuck replication slots"
        - "Large temporary files from batch jobs"
        - "Core dumps filling /var"
      affected_components:
        - "Any service writing to this filesystem"
        - "The OS itself if / fills up"
      expected_action: "Identify what is growing and either truncate/remove the files or provision additional disk space."

    services:
      - name: "Host node"
        overview_url: "https://github.com/prometheus/node_exporter"
        team: ""

    metrics:
      name: "predict_linear(node_filesystem_avail_bytes[3d], 4 * 24 * 3600)"
      description: "Linear projection of available filesystem bytes over the next 4 days, based on the 3-day trend."
      unit: "bytes (alert fires when projected value < 0)"
      threshold_rationale: "A 4-day forward projection gives enough lead time to act before the weekend or a public holiday."
      normal_behavior: "Available bytes decrease slowly and predictably. Sudden drops indicate runaway writes."
      screenshots:
        - file: "host-disk-firing.png"
          caption: "Dashboard when disk fill projection fires"
        - file: "host-disk-recovery.png"
          caption: "Dashboard after disk space is freed"

    alert_behavior:
      silencing: "Silence during planned disk migrations."
      frequency: "Occasional — often precedes a disk-full incident by 1–3 days."

    severities:
      guidance: "Warning initially. Escalate to critical if disk is already above 90% full."
      impacted_users: "Users of all services writing to this filesystem."
      things_to_check:
        - "What filesystem is this? / vs /var vs /data"
        - "What is growing? Logs, database files, tmp?"

    verification:
      prometheus_query: "predict_linear(node_filesystem_avail_bytes{fstype!~'tmpfs|fuse.lxcfs'}[3d], 4 * 24 * 3600) < 0"
      dashboards:
        - name: "Node Disk"
          url: ""
      log_queries: []

    troubleshooting:
      steps:
        - "Find the largest directories: `du -sh /* 2>/dev/null | sort -rh | head -20`"
        - "Check log directory sizes: `du -sh /var/log/*`"
        - "Check if logrotate is working: `systemctl status logrotate` and `ls -lht /var/log/*.gz | head`"
        - "Find recently modified large files: `find / -size +100M -mtime -1 2>/dev/null`"
        - "Check for core dumps: `ls -lh /var/crash/ /tmp/*.core 2>/dev/null`"
        - "If PostgreSQL WAL: check for stuck replication slots: `SELECT slot_name, pg_size_pretty(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)) FROM pg_replication_slots;`"
      dashboards:
        - name: "Node Disk"
          url: ""
      commands:
        - "du -sh /* 2>/dev/null | sort -rh | head -20"
        - "df -h"
        - "find / -size +100M -mtime -1 2>/dev/null"

    resolutions:
      - description: "logrotate misconfiguration caused nginx access logs to grow unbounded. Fixing logrotate config and compressing old logs resolved it."
        incident_url: ""

    dependencies:
      - "logrotate"
      - "Database WAL management"
      - "Batch job tmp file cleanup"

    escalation:
      guidance: "Escalate if current disk usage is above 90% — do not wait for the prediction window."
      slack_channels:
        - name: "#infrastructure-oncall"
          url: ""

    definitions:
      alert_url: ""
      tuning_notes: "The predict_linear window of 3d smooths out daily cycles. Do not reduce below 1d or transient spikes will cause false positives."
      playbook_url: ""

    related:
      alerts:
        - name: "Host out of memory"
          url: "../host-out-of-memory/"
      docs:
        - name: "node_exporter filesystem metrics"
          url: "https://github.com/prometheus/node_exporter"

    credits: "Template adapted from https://runbooks.gitlab.com/template-alert-playbook/"
