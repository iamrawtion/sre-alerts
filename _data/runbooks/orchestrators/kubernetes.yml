service: "Kubernetes"
slug: "kubernetes"
category: "orchestrators"
category_name: "Orchestrators"
description: "Troubleshooting guide for Kubernetes alerting rules — nodes, pods, deployments, and resource pressure."

alerts:
  - name: "Kubernetes node not ready"
    slug: "kubernetes-node-not-ready"
    severity: critical

    overview:
      what: "A node is in NotReady state. Pods scheduled on it may be evicted or unreachable."
      contributing_factors:
        - "Kubelet crashed or is not running"
        - "Node is out of disk, memory, or PID resources"
        - "Network partition — node cannot reach the API server"
      affected_components:
        - "All pods scheduled on the affected node"
        - "Services with endpoints on this node"
      expected_action: "SSH to the node, check kubelet status, and restore the node to Ready state. If unrecoverable, cordon and drain the node."

    services:
      - name: "Kubernetes"
        overview_url: "https://kubernetes.io/docs/"
        team: ""

    metrics:
      name: "kube_node_status_condition{condition='Ready',status='true'}"
      description: "Gauge that is 1 when the node's Ready condition is True, 0 otherwise."
      unit: "boolean (0 or 1)"
      threshold_rationale: "Any node in NotReady state should be investigated immediately."
      normal_behavior: "All nodes should have Ready=true at all times."
      screenshots:
        - file: "k8s-node-notready-firing.png"
          caption: "Dashboard when node NotReady alert fires"
        - file: "k8s-node-notready-recovery.png"
          caption: "Dashboard after node returns to Ready"

    alert_behavior:
      silencing: "Silence during planned node maintenance with `kubectl cordon` first."
      frequency: "Uncommon — usually indicates a hardware failure or kubelet crash."

    severities:
      guidance: "Critical. A NotReady node may cause pod evictions and service disruption."
      impacted_users: "Users of services with pods on the affected node."
      things_to_check:
        - "How many nodes are affected?"
        - "Are there pending pods that cannot be rescheduled?"
        - "Is the control plane healthy?"

    verification:
      prometheus_query: "kube_node_status_condition{condition='Ready',status='true'} == 0"
      dashboards:
        - name: "Kubernetes Nodes"
          url: ""
      log_queries:
        - name: "Kubelet logs"
          url: ""

    troubleshooting:
      steps:
        - "Check all node statuses: `kubectl get nodes -o wide`"
        - "Describe the affected node: `kubectl describe node <node-name>`"
        - "SSH to the node and check kubelet: `systemctl status kubelet`"
        - "Check kubelet logs: `journalctl -u kubelet --since '10 minutes ago' | tail -50`"
        - "Check node conditions for resource pressure: `kubectl describe node <node-name> | grep -A5 Conditions`"
        - "If kubelet is stopped: `systemctl restart kubelet`"
        - "If node is unrecoverable: `kubectl cordon <node-name> && kubectl drain <node-name> --ignore-daemonsets --delete-emptydir-data`"
      dashboards:
        - name: "Kubernetes Nodes"
          url: ""
      commands:
        - "kubectl get nodes -o wide"
        - "kubectl describe node <node-name>"
        - "systemctl status kubelet"
        - "journalctl -u kubelet --since '10 minutes ago' | tail -50"

    resolutions:
      - description: "Disk pressure caused kubelet to mark node NotReady. Clearing unused images with `crictl rmi --prune` resolved it."
        incident_url: ""

    dependencies:
      - "Container runtime (containerd/CRI-O)"
      - "Cloud provider node health checks"
      - "etcd (for API server connectivity)"

    escalation:
      guidance: "Escalate if more than one node is NotReady or if pods cannot be rescheduled."
      slack_channels:
        - name: "#platform-oncall"
          url: ""

    definitions:
      alert_url: ""
      tuning_notes: "Add `for: 2m` to avoid alerting on transient API server connectivity blips."
      playbook_url: ""

    related:
      alerts:
        - name: "Kubernetes pod crash looping"
          url: "../kubernetes-pod-crash-looping/"
      docs:
        - name: "Kubernetes node troubleshooting"
          url: "https://kubernetes.io/docs/tasks/debug/debug-cluster/debug-cluster/"

    credits: "Template adapted from https://runbooks.gitlab.com/template-alert-playbook/"

  - name: "Kubernetes pod crash looping"
    slug: "kubernetes-pod-crash-looping"
    severity: warning

    overview:
      what: "A pod's restart count is high. The container is repeatedly crashing and being restarted by kubelet."
      contributing_factors:
        - "Application crash — unhandled exception, OOM kill, or bad CMD/entrypoint"
        - "Misconfigured liveness probe killing a healthy-but-slow-starting container"
        - "Missing ConfigMap, Secret, or volume mount"
        - "Failing init containers preventing the main container from starting"
        - "App starts before a dependency (DB, cache) is ready — no retry/backoff logic"
        - "File permission issues on mounted volumes"
        - "SIGTERM not handled — container exits non-zero on graceful shutdown"
      affected_components:
        - "The specific pod and the service endpoints it provides"
      expected_action: "Check the pod's previous container logs and exit code to identify the crash reason, then fix the root cause. Do not restart or delete the pod before gathering evidence."

    services:
      - name: "Kubernetes"
        overview_url: "https://kubernetes.io/docs/"
        team: ""

    metrics:
      name: "kube_pod_container_status_restarts_total"
      description: "Cumulative restart count per container. Alert fires when the rate of restarts is high."
      unit: "restarts per 15 minutes"
      threshold_rationale: "More than 3 restarts in 15 minutes indicates a persistent crash loop, not a transient startup failure."
      normal_behavior: "Restart count is stable. A single restart on deploy is acceptable."
      screenshots:
        - file: "k8s-crashloop-firing.png"
          caption: "Dashboard when crash loop alert fires"
        - file: "k8s-crashloop-recovery.png"
          caption: "Dashboard after pod stabilizes"

    alert_behavior:
      silencing: "Silence during deploys if the new version is expected to fail fast during rollout."
      frequency: "Occasional — often accompanies a bad deploy or config change."

    severities:
      guidance: "Warning. Escalate to critical if the crash-looping pod is a singleton (no replicas) serving production traffic."
      impacted_users: "Users of the service the pod belongs to."
      things_to_check:
        - "Is the pod part of a Deployment with multiple replicas?"
        - "Was there a recent deploy or config change?"
        - "Is the crash an OOM kill or an application exception?"
        - "Are resource limits (CPU/memory) too tight for the workload?"
        - "Are readiness or liveness probes configured correctly?"
        - "Are all required ConfigMaps and Secrets present and mounted?"
        - "Are downstream dependencies (databases, external APIs) reachable from the pod?"
        - "Is the node the pod is scheduled on healthy?"

    verification:
      prometheus_query: "increase(kube_pod_container_status_restarts_total[15m]) > 3"
      dashboards:
        - name: "Kubernetes Pods"
          url: ""
      log_queries:
        - name: "Pod logs"
          url: ""

    troubleshooting:
      steps:
        - "Find crash-looping pods: `kubectl get pods -A | grep -v Running | grep -v Completed`"
        - "Describe the pod for events and failure reasons: `kubectl describe pod <pod-name> -n <namespace>`"
        - "Check previous container logs (what happened right before the crash): `kubectl logs <pod-name> -n <namespace> --previous`"
        - "Get the exit code of the last terminated container: `kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.status.containerStatuses[0].lastState.terminated.exitCode}'`"
        - "Check cluster-wide events for context: `kubectl get events -n <namespace> --sort-by='.lastTimestamp'`"
        - "Check node health — a failing node can cause pods to crash: `kubectl get nodes`"
        - "If OOM (exit code 137): check memory limits in the pod spec and increase if appropriate"
        - "If liveness probe is killing the container: check `initialDelaySeconds` and `failureThreshold` — increase if the app starts slowly"
        - "If missing config: look for `MountVolume` or `secret not found` errors in `kubectl describe` Events"
        - "If the crash is hard to reproduce, run the container interactively to inspect it: `kubectl run debug --image=<image> -it --restart=Never -- bash`"
        - "To stop the restart loop while debugging, set `restartPolicy: Never` on a test pod so Kubernetes doesn't mask the failure with retries"
      dashboards:
        - name: "Kubernetes Pods"
          url: ""
      commands:
        - "kubectl get pods -A | grep -v Running | grep -v Completed"
        - "kubectl describe pod <pod-name> -n <namespace>"
        - "kubectl logs <pod-name> -n <namespace> --previous"
        - "kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.status.containerStatuses[0].lastState.terminated.exitCode}'"
        - "kubectl get events -n <namespace> --sort-by='.lastTimestamp'"
        - "kubectl get nodes"
        - "kubectl run debug --image=<image> -it --restart=Never -- bash"

    resolutions:
      - description: "liveness probe initialDelaySeconds was too low for a slow-starting JVM app. Increasing it stopped the crash loop."
        incident_url: ""
      - description: "Bad CMD in the Docker image — entrypoint script exited with code 1 immediately. Identified via kubectl logs --previous and fixed in the Dockerfile."
        incident_url: ""
      - description: "App crashed on startup because the database was not yet ready. Adding an init container with a readiness check resolved the ordering issue."
        incident_url: ""

    dependencies:
      - "ConfigMaps and Secrets the pod mounts"
      - "Downstream services the pod connects to on startup"

    escalation:
      guidance: "Escalate if the crash-looping pod is a singleton or if the crash is causing data corruption."
      slack_channels:
        - name: "#platform-oncall"
          url: ""

    definitions:
      alert_url: ""
      tuning_notes: "The threshold of 3 restarts in 15 minutes distinguishes crash loops from normal rolling restarts on deploy."
      playbook_url: ""

    related:
      alerts:
        - name: "Kubernetes node not ready"
          url: "../kubernetes-node-not-ready/"
      docs:
        - name: "Kubernetes liveness probes"
          url: "https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/"

    credits: "Template adapted from https://runbooks.gitlab.com/template-alert-playbook/"

  - name: "Kubernetes StatefulSet down"
    slug: "kubernetes-statefulset-down"
    severity: critical

    overview:
      what: "A StatefulSet has fewer ready replicas than desired. One or more pods are not running or passing readiness checks."
      contributing_factors:
        - "PVC stuck in Pending — storage class misconfiguration or provisioner failure"
        - "Orphaned PV from a previous release — reclaim policy left the volume in Released state"
        - "Pod stuck in Terminating — volume detach stalled after a node failure or upgrade"
        - "Volume mount conflict — overlapping mount paths or subPath directory missing"
        - "File permission issue — container cannot write to the mounted volume"
        - "Headless service selector mismatch — pods start but are unreachable by ordinal DNS name"
        - "Node cordoned or tainted after a cluster upgrade — pods cannot reschedule"
        - "Ordered rollout blocked — pod-N cannot start until pod-(N-1) is Ready"
      affected_components:
        - "The StatefulSet and any service that routes to its pods"
        - "Dependent services relying on stable pod DNS names (e.g. <pod>.<headless-svc>.<ns>.svc.cluster.local)"
      expected_action: "Check StatefulSet replica status and the lowest-ordinal failing pod first — ordered startup means one stuck pod blocks all higher-ordinal pods."

    services:
      - name: "Kubernetes"
        overview_url: "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"
        team: ""

    metrics:
      name: "kube_statefulset_status_replicas_ready / kube_statefulset_status_replicas"
      description: "Ratio of ready replicas to desired replicas for the StatefulSet. Exported by kube-state-metrics."
      unit: "ratio (0–1)"
      threshold_rationale: "Any value below 1.0 means at least one replica is not serving traffic. For quorum-based systems (etcd, ZooKeeper, Kafka), losing a majority of replicas is a P1 outage."
      normal_behavior: "readyReplicas == replicas at all times outside of a rolling update."
      screenshots:
        - file: "k8s-statefulset-down-firing.png"
          caption: "Dashboard when StatefulSet ready replica count drops"
        - file: "k8s-statefulset-down-recovery.png"
          caption: "Dashboard after StatefulSet returns to full replica count"

    alert_behavior:
      silencing: "Silence during planned rolling upgrades. Use a time-bounded Alertmanager silence scoped to the StatefulSet name."
      frequency: "Uncommon in steady state — typically follows a cluster upgrade, storage change, or bad deploy."

    severities:
      guidance: "Critical if replicas drop below quorum for consensus systems (etcd, Kafka, ZooKeeper, Cassandra). Warning if at least one replica is healthy and the service can still serve traffic."
      impacted_users: "Users of any service backed by this StatefulSet."
      things_to_check:
        - "Which ordinal pod is failing first? (pod-0 blocks pod-1, pod-1 blocks pod-2)"
        - "Are the PVCs Bound or stuck Pending?"
        - "Did a cluster upgrade change the storage class or node availability zone?"
        - "Is the headless service selector still matching the pod labels?"
        - "Are any nodes cordoned that the StatefulSet pods were scheduled on?"

    verification:
      prometheus_query: "kube_statefulset_status_replicas_ready / kube_statefulset_status_replicas < 1"
      dashboards:
        - name: "Kubernetes StatefulSets"
          url: ""
      log_queries:
        - name: "Pod logs for failing ordinal"
          url: ""

    troubleshooting:
      steps:
        - "Check StatefulSet replica status — note READY vs desired: `kubectl get statefulsets -n <namespace>`"
        - "Get detailed events and rollout strategy: `kubectl describe statefulset <name> -n <namespace>`"
        - "Check if the rollout is stuck mid-update: `kubectl rollout status statefulset <name> -n <namespace>`"
        - "Identify which pod is failing — start from the lowest ordinal: `kubectl get pods -n <namespace> -o wide`"
        - "Describe the failing pod for mount errors, scheduling failures, or probe failures: `kubectl describe pod <name>-0 -n <namespace>`"
        - "Check PVC status — Pending means storage has not been provisioned: `kubectl get pvc -n <namespace>`"
        - "If a PVC is Pending, describe it to see the provisioner error: `kubectl describe pvc <pvc-name> -n <namespace>`"
        - "Check for orphaned PVs stuck in Released state: `kubectl get pv | grep Released`"
        - "Verify the storage class exists and the provisioner is healthy: `kubectl get storageclass && kubectl get pods -n kube-system | grep provisioner`"
        - "Confirm the headless service exists and its selector matches pod labels: `kubectl get svc -n <namespace> && kubectl get endpoints -n <namespace>`"
        - "Check recent events sorted by time: `kubectl get events -n <namespace> --sort-by=.metadata.creationTimestamp`"
        - "If a pod is stuck Terminating after a node failure, force-delete it — the StatefulSet controller will recreate it: `kubectl delete pod <name>-0 --force --grace-period=0 -n <namespace>`"
        - "To roll back to a previous revision: `kubectl rollout history statefulset <name> -n <namespace>` then `kubectl rollout undo statefulset <name> -n <namespace>`"
      dashboards:
        - name: "Kubernetes StatefulSets"
          url: ""
      commands:
        - "kubectl get statefulsets -n <namespace>"
        - "kubectl describe statefulset <name> -n <namespace>"
        - "kubectl rollout status statefulset <name> -n <namespace>"
        - "kubectl rollout history statefulset <name> -n <namespace>"
        - "kubectl get pods -n <namespace> -o wide"
        - "kubectl get pvc -n <namespace>"
        - "kubectl describe pvc <pvc-name> -n <namespace>"
        - "kubectl get pv | grep Released"
        - "kubectl get endpoints -n <namespace>"
        - "kubectl get events -n <namespace> --sort-by=.metadata.creationTimestamp"
        - "kubectl delete pod <name>-0 --force --grace-period=0 -n <namespace>"
        - "kubectl rollout undo statefulset <name> -n <namespace>"

    resolutions:
      - description: "PVC stuck Pending after a cluster upgrade changed the default storage class. Updating the PVC to reference the correct storage class unblocked provisioning."
        incident_url: ""
      - description: "Orphaned PV left in Released state after a namespace migration. Patching the PV to clear its claimRef allowed the new PVC to bind."
        incident_url: ""
      - description: "Pod stuck Terminating after a node was force-terminated during an upgrade. Force-deleting the pod allowed the StatefulSet controller to recreate it on a healthy node."
        incident_url: ""
      - description: "Headless service selector was missing a label added in a recent deploy. Updating the selector restored ordinal DNS resolution and unblocked the rollout."
        incident_url: ""

    dependencies:
      - "PersistentVolumeClaims and the storage class provisioner"
      - "Headless service (required for stable pod DNS names)"
      - "Nodes in the correct availability zone (for zone-pinned volumes)"

    escalation:
      guidance: "Escalate immediately if the StatefulSet is a quorum-based system (etcd, Kafka, ZooKeeper) and ready replicas drop below majority. Data loss is possible if the remaining pods are restarted before the failed one recovers."
      slack_channels:
        - name: "#platform-oncall"
          url: ""

    definitions:
      alert_url: ""
      tuning_notes: "For single-replica StatefulSets, any pod failure fires immediately (0/1 = 0). For multi-replica sets, consider alerting on < 1 (any degradation) vs. < 0.5 (quorum loss) depending on tolerance."
      playbook_url: ""

    related:
      alerts:
        - name: "Kubernetes pod crash looping"
          url: "../kubernetes-pod-crash-looping/"
        - name: "Kubernetes node not ready"
          url: "../kubernetes-node-not-ready/"
      docs:
        - name: "Kubernetes StatefulSet concepts"
          url: "https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/"
        - name: "Kubernetes StatefulSet troubleshooting"
          url: "https://kubernetes.io/docs/tasks/debug/debug-application/debug-statefulset/"

    credits: "Template adapted from https://runbooks.gitlab.com/template-alert-playbook/"

  - name: "Kubernetes container OOM killed"
    slug: "kubernetes-container-oom-killed"
    severity: critical

    overview:
      what: "A container was terminated by the Linux kernel's OOM killer because it exceeded its cgroup memory limit. Exit code 137 (SIGKILL) is recorded with Reason: OOMKilled."
      contributing_factors:
        - "Memory limit set below actual peak usage — sized from averages or staging, not production peaks"
        - "Memory leak — usage grows steadily across container lifetimes until it hits the limit"
        - "Traffic or workload spike — large payloads, fan-out queries, or batch jobs push usage past the steady-state baseline"
        - "JVM/runtime heap misconfigured — heap ceiling set above the container limit, so the cgroup kills before the runtime throws OutOfMemoryError"
        - "Node memory pressure — kubelet evicts pods when the node runs low, before individual containers hit their own limits"
      affected_components:
        - "The OOMKilled container and the pod it belongs to"
        - "In-flight requests and open connections (SIGKILL gives no time to flush or close)"
        - "Downstream services that lose the connection without a graceful shutdown"
      expected_action: "Confirm OOMKilled is the cause (not a probe failure or eviction), identify whether the root cause is a bad limit, a leak, or a spike, then apply the matching fix."

    services:
      - name: "Kubernetes"
        overview_url: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"
        team: ""

    metrics:
      name: "kube_pod_container_status_last_terminated_reason"
      description: "Gauge exported by kube-state-metrics. Value is 1 when the last termination reason matches the label value (e.g. OOMKilled)."
      unit: "boolean (0 or 1)"
      threshold_rationale: "Any OOMKilled termination is actionable — either the limit is wrong or the application has a leak."
      normal_behavior: "Containers should never be OOMKilled. A single occurrence warrants investigation; repeated occurrences indicate a persistent misconfiguration or leak."
      screenshots:
        - file: "k8s-oomkilled-firing.png"
          caption: "Dashboard when OOMKilled termination is detected"
        - file: "k8s-oomkilled-memory-trend.png"
          caption: "Memory usage trend showing climb to limit before kill"

    alert_behavior:
      silencing: "Do not silence. OOMKilled events are always worth investigating. If a planned batch job is expected to use high memory, increase its limit before running, not after."
      frequency: "Should be rare. Repeated OOMKills on the same workload indicate the root cause has not been fixed."

    severities:
      guidance: "Critical. SIGKILL is abrupt — in-flight work is lost and connections drop without warning. Stateful workloads risk data corruption."
      impacted_users: "Users of the service the pod belongs to, for the duration of the restart."
      things_to_check:
        - "Is the exit code 137 with Reason: OOMKilled, or is it a probe failure or eviction? (Check kubectl describe pod)"
        - "Is this a single container repeatedly hitting its limit, or multiple pods dying together? (Multiple = node pressure)"
        - "Does memory usage grow steadily over time (leak), spike at specific events (bad limit or spike), or is this the first occurrence?"
        - "What is the container's memory limit vs. its actual peak usage?"
        - "Is the node showing MemoryPressure?"

    verification:
      prometheus_query: "kube_pod_container_status_last_terminated_reason{reason='OOMKilled'} == 1"
      dashboards:
        - name: "Kubernetes Pods"
          url: ""
      log_queries:
        - name: "Pod logs (previous container)"
          url: ""

    troubleshooting:
      steps:
        - "Confirm OOMKilled is the cause — look for Reason: OOMKilled and Exit Code: 137 in Last State: `kubectl describe pod <pod-name> -n <namespace>`"
        - "Check if this is node pressure (multiple pods affected) vs. a single container hitting its own limit: `kubectl describe node <node-name> | grep -A5 MemoryPressure`"
        - "Check current memory usage vs. limits: `kubectl top pod <pod-name> -n <namespace>`"
        - "Check the configured limit: `kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.containers[0].resources.limits.memory}'`"
        - "Read previous container logs for allocation failures, GC thrash, or heap errors before the kill: `kubectl logs <pod-name> -n <namespace> --previous`"
        - "Chart memory over time in Prometheus to distinguish a leak (steady climb across restarts) from a bad limit (flat baseline, spike at events): `container_memory_working_set_bytes{pod='<pod-name>'} / container_spec_memory_limit_bytes{pod='<pod-name>'}`"
        - "If a memory leak is suspected, exec into the container and check process memory: `kubectl exec -it <pod-name> -n <namespace> -- cat /proc/1/status | grep -i VmRSS`"
        - "If the container uses a JVM, confirm heap is sized below the container limit (e.g. `-Xmx` at ~75% of the limit) to leave room for off-heap memory"
        - "As a quick fix while investigating, patch the memory limit: `kubectl patch deployment <name> -n <namespace> -p '{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"<container>\",\"resources\":{\"limits\":{\"memory\":\"1Gi\"}}}]}}}}'`"
      dashboards:
        - name: "Kubernetes Pods"
          url: ""
      commands:
        - "kubectl describe pod <pod-name> -n <namespace>"
        - "kubectl top pod <pod-name> -n <namespace>"
        - "kubectl get pod <pod-name> -n <namespace> -o jsonpath='{.spec.containers[0].resources.limits.memory}'"
        - "kubectl logs <pod-name> -n <namespace> --previous"
        - "kubectl describe node <node-name> | grep -A5 MemoryPressure"
        - "kubectl get events -n <namespace> --field-selector reason=OOMKilling --sort-by=.lastTimestamp"

    resolutions:
      - description: "Memory limit was sized from staging load. Production peak usage exceeded it during a traffic spike. Increasing the limit to p99 of production peak resolved it."
        incident_url: ""
      - description: "JVM heap set to -Xmx equal to the container limit, leaving no room for off-heap (metaspace, thread stacks, native buffers). Container was OOMKilled while heap was still under limit. Setting -Xmx to 75% of the container limit resolved it."
        incident_url: ""
      - description: "Memory leak introduced in a new version — usage climbed steadily after each restart. Identified via Prometheus memory trend across multiple container lifetimes. Fixed in application code."
        incident_url: ""

    dependencies:
      - "Node allocatable memory (node pressure can OOMKill pods under their own limit)"
      - "Metrics Server or Prometheus (for kubectl top and memory trend analysis)"

    escalation:
      guidance: "Escalate if the OOMKilled pod is a singleton, a stateful workload with risk of data corruption, or if node MemoryPressure is causing multiple pods to die together."
      slack_channels:
        - name: "#platform-oncall"
          url: ""

    definitions:
      alert_url: ""
      tuning_notes: "Set memory limits at p99 of production peak usage, not average. Keep requests-to-limits ratio below 4x to avoid implicit node overcommitment. For Guaranteed QoS (last evicted under node pressure), set requests equal to limits."
      playbook_url: ""

    related:
      alerts:
        - name: "Kubernetes pod crash looping"
          url: "../kubernetes-pod-crash-looping/"
        - name: "Kubernetes node not ready"
          url: "../kubernetes-node-not-ready/"
      docs:
        - name: "Kubernetes resource management"
          url: "https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/"
        - name: "Kubernetes QoS classes"
          url: "https://kubernetes.io/docs/concepts/workloads/pods/pod-qos/"

    credits: "Template adapted from https://runbooks.gitlab.com/template-alert-playbook/"
